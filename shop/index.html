<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @font-face {
            font-family: "kai";
            src: url("../fonts/TW-Kai-98_1.ttf");
        }

        @font-face {
            font-family: "sung";
            src: url("../fonts/TW-Sung-98_1.ttf");
        }

        body {
            background: url("../imgs/flag.png");
            margin: 0;
            padding: 0;
        }

        #TWtitle {
            color: blue;
            text-shadow: 5px 5px 10px white;
            background-image: linear-gradient(40deg, red, yellow, lime, green, blue, purple, red, yellow, lime, green, blue, purple);
            background-size: 200% 100%;
            background-position: right;
            animation: gradientMove 1s linear infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: left;
            }

            100% {
                background-position: right;
            }
        }

        @keyframes swing {
            0% {
                transform: rotate(0deg);
                box-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
                filter: brightness(1);
            }

            25% {
                transform: rotate(0.5deg) scale(1.02);
                box-shadow: 0 0 20px rgba(255, 255, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.6);
                filter: brightness(1.2);
            }

            33% {
                transform: rotate(1deg) scale(1.05);
                box-shadow: 0 0 25px rgba(255, 255, 0, 1), 0 0 35px rgba(255, 215, 0, 0.8);
                filter: brightness(1.3);
            }

            50% {
                transform: rotate(0deg) scale(1.03);
                box-shadow: 0 0 15px rgba(255, 255, 0, 0.7), 0 0 25px rgba(255, 215, 0, 0.5);
                filter: brightness(1.1);
            }

            66% {
                transform: rotate(-1deg) scale(1.05);
                box-shadow: 0 0 25px rgba(255, 255, 0, 1), 0 0 35px rgba(255, 215, 0, 0.8);
                filter: brightness(1.3);
            }

            75% {
                transform: rotate(-0.5deg) scale(1.02);
                box-shadow: 0 0 20px rgba(255, 255, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.6);
                filter: brightness(1.2);
            }

            100% {
                transform: rotate(0deg) scale(1.0);
                box-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
                filter: brightness(1);
            }
        }

        #nav {
            background: white;
            display: flex;
            flex-direction: row;
            left: 0px;
            width: 100%;
            font-family: 'sung';
        }

        #nav span {
            margin: 0 10px;
        }

        #side-nav {
            position: absolute;
            margin-top: 50px;
            background: white;
            display: flex;
            flex-direction: column;
            left: 0px;
            width: 200px;
            font-family: 'sung';
        }

        #side-nav ul {
            list-style-type: square;
            padding: 0 0 0 20px;
        }

        #side-nav a {
            text-decoration: none;
            color: black;
        }

        #side-nav a:hover {
            font-size: 125%;
            text-decoration: underline;
        }

        #main-content {
            margin-left: 200px;
            color: yellow;
            background: red;
            rotate: 0deg;
            width: calc(100% - 280px);
            animation: swing 1s ease-in-out infinite;
            font-family: 'sung';
            font-style: italic;
        }

        #item-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-left: 200px;
            background: white;
            width: calc(100% - 200px);
            font-family: 'kai';
            box-sizing: border-box;
            padding: 10px;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            height: auto;
            min-height: 300px;
        }

        .item img {
            width: 200px;
            height: 200px;
            display: block;
            border: black 1px solid;
        }

        .item h2 {
            font-size: 30px;
            margin: 0;
        }

        .item h3 {
            font-size: 20px;
            margin: 0;
        }

        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 16px;
            margin-right: 10px;
        }

        .discount-price {
            color: #FF0000;
            font-weight: bold;
        }

        .discount-tag {
            background-color: #FF4444;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 14px;
            margin-left: 10px;
            display: inline-block;
        }

        /* 數量控制器樣式 */
        .quantity-controller {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #f0f0f0;
            border: 1px solid #999;
            border-radius: 4px;
        }

        .qty-btn:hover {
            background: #e0e0e0;
        }

        .qty-input {
            width: 60px;
            height: 26px;
            text-align: center;
            font-size: 16px;
            font-family: inherit;
            border: 1px solid #999;
            border-radius: 4px;
        }

        .buy-button {
            position: relative;
            background-image: url('../imgs/buy-button.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: none;
            background-color: transparent;
            width: 200px;
            height: 80px;
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease;
            margin-top: 8px;
            outline: none;
        }

        .buy-button:hover {
            filter: brightness(1.10);
        }

        .buy-button:active {
            transform: translateY(2px) scale(0.98);
            filter: brightness(0.9);
        }

        #uselessRobotIcon {
            display: block;
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            border-radius: 100%;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #q {
            display: none;
            position: fixed;
            bottom: 60px;
            right: 100px;
            width: 250px;
            height: 100px;
        }

        #uselessRobotIcon:hover+#q {
            display: block;
        }
    </style>

                }
            ];

            const shopCart = {
                items: [],
                addItem(item, quantity = 1) {
                    const existIndex = this.items.findIndex(it => it.name === item.name);
                    if (existIndex > -1) {
                        this.items[existIndex].quantity = (this.items[existIndex].quantity || 1) + quantity;
                    } else {
                        this.items.push({ ...item, quantity: quantity });
                    }
                    console.log(`購物車已新增：${item.name} × ${quantity}`);
                    this.save();
                },
                removeItem(index) {
                    this.items.splice(index, 1);
                    this.save();
                },
                clear() {
                    this.items = [];
                    this.save();
                },
                getTotal() {
                    return this.items.reduce((total, item) => {
                        const unitPrice = item.discount ? Math.round(item.price * item.discount) : item.price;
                        return total + (unitPrice * (item.quantity || 1));
                    }, 0);
                },
                save() {
                    try {
                        localStorage.setItem('shopCart', JSON.stringify(this.items));
                    } catch (e) {
                        console.error('儲存購物車失敗', e);
                    }
                },
                load() {
                    try {
                        const raw = localStorage.getItem('shopCart');
                        if (raw) {
                            this.items = JSON.parse(raw);
                        }
                    } catch (e) {
                        console.error('讀取購物車失敗', e);
                        this.items = [];
                    }
                }
            };

            shopCart.load();

            const itemList = document.getElementById("item-list");
            itemList.innerHTML = "";

            function formatChineseNumber(num) {
                const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
                if (num === 0) return digits[0];

                let result = "";
                let remain = num;

                if (remain >= 1000000000000) {
                    let zhao = Math.floor(remain / 1000000000000);
                    result += convertUnderTenThousand(zhao) + "兆";
                    remain = remain % 1000000000000;
                }

                if (remain >= 100000000) {
                    let yi = Math.floor(remain / 100000000);
                    result += convertUnderTenThousand(yi) + "億";
                    remain = remain % 100000000;
                }

                if (remain >= 10000) {
                    let wan = Math.floor(remain / 10000);
                    result += convertUnderTenThousand(wan) + "萬";
                    remain = remain % 10000;
                }

                if (remain > 0) {
                    result += convertUnderTenThousand(remain);
                }

                function convertUnderTenThousand(n) {
                    if (n === 0) return "";
                    let str = "";

                    if (n >= 1000) {
                        let qian = Math.floor(n / 1000);
                        str += digits[qian] + "千";
                        n = n % 1000;
                    }

                    if (n >= 100) {
                        let bai = Math.floor(n / 100);
                        str += digits[bai] + "百";
                        n = n % 100;
                    }

                    if (n >= 10) {
                        let shi = Math.floor(n / 10);
                        if (shi === 1 && str === "") {
                            str += "十";
                        } else {
                            str += digits[shi] + "十";
                        }
                        n = n % 10;
                    }

                    if (n > 0) {
                        str += digits[n];
                    }

                    return str;
                }

                return result;
            }

            items.forEach(item => {
                const container = document.createElement("div");
                const listItem = document.createElement("h2");
                const itemDescription = document.createElement("div");
                const itemImage = document.createElement("img");
                const itemPrice = document.createElement("h3");
                let price = item.price;

                let originalPrice = formatChineseNumber(price);
                let discountedPrice = "";
                let discountTag = "";

                if (item.discount) {
                    let newPrice = Math.round(price * item.discount);
                    discountedPrice = formatChineseNumber(newPrice);
                    let discountPercent = Math.round(item.discount * 10);
                    discountTag = `現正${discountPercent}折`;
                }

                itemImage.src = item.picture || "../imgs/sub3.gif";
                itemImage.alt = item.name;
                container.classList.add("item");
                listItem.textContent = `${item.name}`;
                itemDescription.textContent = item.description;

                if (item.discount) {
                    itemPrice.innerHTML = `
                        <span class="original-price">${originalPrice}元</span>
                        <span class="discount-price">${discountedPrice}元</span>
                        <span class="discount-tag">${discountTag}</span>
                    `;
                } else {
                    itemPrice.innerHTML = `<font color="#FF0000">${originalPrice}</font>元`;
                }

                container.appendChild(itemImage);
                container.appendChild(listItem);
                container.appendChild(itemPrice);
                container.appendChild(itemDescription);

                let displayPrice = item.discount ? Math.round(price * item.discount) : price;

                // 數量調整控制器
                const qtyContainer = document.createElement('div');
                qtyContainer.className = 'quantity-controller';

                const minusBtn = document.createElement('button');
                minusBtn.type = 'button';
                minusBtn.className = 'qty-btn';
                minusBtn.textContent = '－';

                const qtyInput = document.createElement('input');
                qtyInput.type = 'number';
                qtyInput.className = 'qty-input';
                qtyInput.value = 1;
                qtyInput.min = 1;

                const plusBtn = document.createElement('button');
                plusBtn.type = 'button';
                plusBtn.className = 'qty-btn';
                plusBtn.textContent = '＋';

                minusBtn.addEventListener('click', () => {
                    let val = parseInt(qtyInput.value, 10) || 1;
                    if (val > 1) {
                        qtyInput.value = val - 1;
                    }
                });

                plusBtn.addEventListener('click', () => {
                    let val = parseInt(qtyInput.value, 10) || 1;
                    qtyInput.value = val + 1;
                });

                qtyInput.addEventListener('change', () => {
                    let val = parseInt(qtyInput.value, 10);
                    if (isNaN(val) || val < 1) {
                        qtyInput.value = 1;
                    }
                });

                qtyContainer.appendChild(minusBtn);
                qtyContainer.appendChild(qtyInput);
                qtyContainer.appendChild(plusBtn);
                container.appendChild(qtyContainer);

                // 購買按鈕
                const buyBtn = document.createElement('button');
                buyBtn.className = 'buy-button';
                buyBtn.setAttribute('data-name', item.name);
                buyBtn.setAttribute('data-price', displayPrice);
                buyBtn.addEventListener('click', function () {
                    const count = parseInt(qtyInput.value, 10) || 1;
                    const subtotal = displayPrice * count;
                    if (confirm(`確認購買 ${count} 份【${item.name}】嗎？\n總計金額：${subtotal} 元`)) {
                        alert(`已將 ${count} 份【${item.name}】加入台灣價值購物車！`);
                        shopCart.addItem(item, count);
                    }
                });

                container.appendChild(buyBtn);
                itemList.appendChild(container);
            });
        });
