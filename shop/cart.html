<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣價值購物車</title>
    <style>
        @font-face {
            font-family: "kai";
            src: url("../fonts/TW-Kai-98_1.ttf");
        }

        @font-face {
            font-family: "sung";
            src: url("../fonts/TW-Sung-98_1.ttf");
        }

        body {
            font-family: "kai", "Microsoft JhengHei", Arial, sans-serif;
            background: url("../imgs/flag.png");
            /* 繼承首頁愛國背景 */
            padding: 20px;
            color: #0000FF;
        }

        @keyframes blink {
            50% {
                visibility: hidden;
            }
        }

        .blink-text {
            animation: 1s blink infinite steps(1);
            color: #FF0000;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px;
            border: 5px double #FF0000;
            /* 復古雙紅線邊框 */
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            font-family: 'sung', serif;
            text-align: center;
            color: blue;
            text-shadow: 3px 3px 6px white;
            background-image: linear-gradient(40deg, red, yellow, lime, green, blue, purple, red);
            background-size: 200% 100%;
            padding: 10px;
            border-radius: 5px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 2px dashed #008000;
            /* 綠色虛線 */
        }

        .cart-item img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border: 3px solid #FFD700;
            /* 金色愛國邊框 */
            border-radius: 6px;
            background: #fafafa;
        }

        .cart-item .meta {
            flex: 1;
        }

        .cart-item .meta h3 {
            margin: 0 0 6px 0;
            font-size: 20px;
            color: #008000;
            /* 民主綠 */
        }

        .cart-item .meta p {
            margin: 0;
            color: #333;
            font-size: 15px;
        }

        .cart-item .actions {
            text-align: right;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            font-family: "kai";
            box-shadow: 2px 2px 0px #000;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .btn-clear {
            background: #ffc107;
            color: #000;
            border: 2px solid #000;
        }

        .btn-checkout {
            background: #ff0000;
            color: #fff;
            border: 2px solid #ffe600;
            font-size: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .btn-remove {
            background: #444;
            color: white;
            border: 1px solid #000;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-remove:hover {
            background: #ff0000;
        }

        #total {
            font-size: 28px;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 1px 1px 0 yellow;
        }

        .empty {
            text-align: center;
            color: #ff0000;
            padding: 40px 0;
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            font-size: 18px;
            font-weight: bold;
            color: #005f61;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🇹🇼 台灣價值購物車 🇹🇼</h1>
        <div style="text-align: center; margin-bottom: 15px;">
            <span class="blink-text">🔥 狂賀！本月儲值台灣價值，即享民主甘甜好康！ 🔥</span>
        </div>

        <div id="cart-items"></div>

        <div
            style="display:flex; justify-content:space-between; align-items:center; margin-top:25px; flex-wrap: wrap; gap: 15px;">
            <div>
                <button id="clear-cart" class="btn btn-clear">放棄台灣價值（再想想！） 😢</button>
            </div>
            <div style="text-align:right">
                <div style="font-size: 18px; font-weight: bold;">
                    本次預計儲值台灣價值：<span id="total">0</span> 元
                </div>
                <div style="margin-top:12px">
                    <button id="checkout" class="btn btn-checkout">💖 儲值台灣價值，護台去！</button>
                </div>
            </div>
        </div>
        <div style="margin-top:20px; text-align:center;">
            <a class="back-link" href="index.html">🔙 繼續充值更多台灣價值！</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function loadCart() {
                try {
                    const raw = localStorage.getItem('shopCart');
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    console.error('讀取台灣價值失敗', e);
                    return [];
                }
            }

            function saveCart(items) {
                try {
                    localStorage.setItem('shopCart', JSON.stringify(items));
                } catch (e) {
                    console.error(e);
                }
            }

            let items = loadCart();
            const container = document.getElementById('cart-items');

            // 修正：補回 item.discount 乘法
            function formatPrice(item) {
                return item.discount ? Math.round(item.price * item.discount) : item.price;
            }

            function render() {
                container.innerHTML = '';
                if (!items || items.length === 0) {
                    container.innerHTML = '<div class="empty">⚠️ 您的台灣價值餘額不足（購物車是空的），快去加值！</div>';
                    document.getElementById('total').textContent = '0';
                    return;
                }

                let total = 0;
                items.forEach((item, idx) => {
                    const displayPrice = formatPrice(item);
                    total += displayPrice;

                    // 確保照片路徑符合專案格式
                    const itemImage = item.picture || "/imgs/sub3.gif";

                    const el = document.createElement('div');
                    el.className = 'cart-item';
                    el.innerHTML = `
                        <img src="${itemImage}" alt="${item.name}">
                        <div class="meta">
                            <h3>🌿 ${item.name}</h3>
                            <p>${item.description || '愛台灣免解釋！'}</p>
                        </div>
                        <div style="width:180px; text-align:right">
                            <div style="font-size: 16px; font-weight: bold; color: red;">價值：${displayPrice} 元</div>
                            <div style="margin-top:8px">
                                <button class="btn-remove" data-idx="${idx}">丟棄（叛國？💔）</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(el);
                });

                document.getElementById('total').textContent = total;

                // 綁定移除按鈕
                Array.from(document.querySelectorAll('.btn-remove')).forEach(btn => {
                    btn.addEventListener('click', function () {
                        const idx = Number(this.getAttribute('data-idx'));
                        if (!Number.isNaN(idx)) {
                            if (confirm(`真的要移除「${items[idx].name}」嗎？少這一件，台灣價值會降低喔！`)) {
                                items.splice(idx, 1);
                                saveCart(items);
                                render();
                            }
                        }
                    });
                });
            }

            // 放棄台灣價值的警示
            document.getElementById('clear-cart').addEventListener('click', function () {
                if (confirm('🚨 警告 🚨\n您確定要清空購物車，放棄這次充值台灣價值的機會嗎？\n（中共同路人可能會笑喔！）')) {
                    if (confirm('真的不再考慮一下嗎？民主甘甜雞排與大冰奶正在哭泣！😭')) {
                        items = [];
                        saveCart(items);
                        render();
                    }
                }
            });

            // 修正：補回 reduce 中的乘法並加上充滿台灣價值的對話框
            document.getElementById('checkout').addEventListener('click', function () {
                const total = items.reduce((sum, it) => sum + (it.discount ? Math.round(it.price * it.discount) : it.price), 0);
                if (items.length === 0) {
                    alert('購物車是空的，無法為台灣發電！快去多買幾份雞排！');
                    return;
                }

                alert(`🇹🇼 感謝您的愛國心！ 🇹🇼\n\n您即將為台灣社會注入 ${total} 元的民主防護資金！\n系統正透過安全無虞、非華為、無中資的「民主防火牆」為您引導至結帳程序...\n\n攜手守護，有你真好！🤝`);
                // 這裡可以跳轉至 checkout.html 
                window.location.href = 'checkout.html';
            });

            render();
        });
    </script>
</body>

</html>
